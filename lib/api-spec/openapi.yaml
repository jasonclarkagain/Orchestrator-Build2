openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ORCH_2026 Orchestrator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tools
    description: Tool registry operations
  - name: executions
    description: Execution log operations
  - name: plugins
    description: Plugin registry operations
  - name: dashboard
    description: Dashboard metrics
  - name: intent
    description: Intent engine operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tools:
    get:
      operationId: listTools
      tags: [tools]
      summary: List all tools
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: List of tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tool"
    post:
      operationId: createTool
      tags: [tools]
      summary: Create a new tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"

  /tools/{id}:
    get:
      operationId: getTool
      tags: [tools]
      summary: Get a tool by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
        "404":
          description: Not found
    patch:
      operationId: updateTool
      tags: [tools]
      summary: Update a tool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolUpdate"
      responses:
        "200":
          description: Updated tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
    delete:
      operationId: deleteTool
      tags: [tools]
      summary: Delete a tool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tools/{id}/toggle:
    patch:
      operationId: toggleTool
      tags: [tools]
      summary: Toggle tool active/inactive status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"

  /executions:
    get:
      operationId: listExecutions
      tags: [executions]
      summary: List executions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [completed, failed, running]
        - name: toolId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Execution"
    post:
      operationId: triggerExecution
      tags: [executions]
      summary: Trigger a tool execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionInput"
      responses:
        "201":
          description: Triggered execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"

  /executions/{id}:
    get:
      operationId: getExecution
      tags: [executions]
      summary: Get an execution by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"

  /plugins:
    get:
      operationId: listPlugins
      tags: [plugins]
      summary: List all plugins
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: installed
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of plugins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plugin"

  /plugins/{id}/install:
    post:
      operationId: installPlugin
      tags: [plugins]
      summary: Install a plugin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Installed plugin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
    delete:
      operationId: uninstallPlugin
      tags: [plugins]
      summary: Uninstall a plugin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Uninstalled plugin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get system overview stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/velocity:
    get:
      operationId: getExecutionVelocity
      tags: [dashboard]
      summary: Execution velocity over time (last 7 days)
      responses:
        "200":
          description: Velocity data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VelocityPoint"

  /dashboard/runtime-distribution:
    get:
      operationId: getRuntimeDistribution
      tags: [dashboard]
      summary: Runtime distribution breakdown
      responses:
        "200":
          description: Runtime distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeBucket"

  /dashboard/activity:
    get:
      operationId: getLiveActivity
      tags: [dashboard]
      summary: Live activity feed (recent executions)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Execution"

  /intent/parse:
    post:
      operationId: parseIntent
      tags: [intent]
      summary: Parse a natural language query to map execution tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntentQuery"
      responses:
        "200":
          description: Parsed intent result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Tool:
      type: object
      required: [id, name, description, runtime, status, version, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        runtime:
          type: string
          enum: [bun, python, docker, wasm]
        status:
          type: string
          enum: [active, inactive]
        version:
          type: string
        createdAt:
          type: string

    ToolInput:
      type: object
      required: [name, description, runtime, version]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        runtime:
          type: string
          enum: [bun, python, docker, wasm]
        version:
          type: string

    ToolUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        runtime:
          type: string
          enum: [bun, python, docker, wasm]
        status:
          type: string
          enum: [active, inactive]
        version:
          type: string

    Execution:
      type: object
      required: [id, toolId, toolName, runtime, status, durationMs, startedAt]
      properties:
        id:
          type: integer
        toolId:
          type: integer
        toolName:
          type: string
        runtime:
          type: string
          enum: [bun, python, docker, wasm]
        status:
          type: string
          enum: [completed, failed, running]
        durationMs:
          type: ["integer", "null"]
        startedAt:
          type: string
        output:
          type: ["string", "null"]

    ExecutionInput:
      type: object
      required: [toolId]
      properties:
        toolId:
          type: integer

    Plugin:
      type: object
      required: [id, name, description, category, version, runtime, installed]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        category:
          type: string
        version:
          type: string
        runtime:
          type: string
          enum: [bun, python, docker, wasm]
        installed:
          type: boolean
        installedAt:
          type: ["string", "null"]

    DashboardStats:
      type: object
      required: [activeTools, totalTools, executions24h, successRate, avgDurationMs]
      properties:
        activeTools:
          type: integer
        totalTools:
          type: integer
        executions24h:
          type: integer
        successRate:
          type: number
        avgDurationMs:
          type: number

    VelocityPoint:
      type: object
      required: [date, count, successCount]
      properties:
        date:
          type: string
        count:
          type: integer
        successCount:
          type: integer

    RuntimeBucket:
      type: object
      required: [runtime, count]
      properties:
        runtime:
          type: string
        count:
          type: integer

    IntentQuery:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1

    IntentResult:
      type: object
      required: [query, matchedTools, explanation]
      properties:
        query:
          type: string
        matchedTools:
          type: array
          items:
            $ref: "#/components/schemas/Tool"
        explanation:
          type: string
        suggestedExecution:
          type: ["boolean", "null"]
